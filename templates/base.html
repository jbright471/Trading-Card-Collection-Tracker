<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}TCG Collection Tracker{% endblock %}</title>
  <script>
    (() => {
      const stored = localStorage.getItem("tcg-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = stored || (prefersDark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  <script src="{{ url_for('static', filename='theme.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="app-nav">
    <a class="brand" href="/">TCG Collection Tracker</a>
    <div class="nav-right">
      <nav class="nav-links" aria-label="Primary">
        <a href="/" class="{{ 'active' if request.path == '/' else '' }}">Dashboard</a>
        <a href="/add" class="{{ 'active' if request.path == '/add' else '' }}">Add Card</a>
        <a href="/data" class="{{ 'active' if request.path == '/data' else '' }}">Data</a>
      </nav>
      {% if tracker_locked %}
        <a class="button button-secondary compact-button" href="/login">Unlock</a>
      {% elif access_pin_enabled and tracker_unlocked %}
        <form method="post" action="/logout" class="inline-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="button button-secondary compact-button" type="submit">Lock</button>
        </form>
      {% endif %}
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch color theme" aria-pressed="false">
        <span class="theme-toggle-track" aria-hidden="true"><span class="theme-toggle-thumb"></span></span>
        <span class="theme-toggle-label">Light</span>
      </button>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <div class="toast" id="globalToast" role="status" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
